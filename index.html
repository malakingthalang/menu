                        </div>
                    </button>

                    <!-- Messenger Button -->
                    <button onclick="checkout('messenger')"
                        class="w-full bg-[#0084FF] hover:bg-[#0073e6] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2.5 text-base transition-all active:scale-[0.98]">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.837 1.398 5.365 3.584 7.034V22l3.258-1.79c.867.239 1.784.368 2.745.368 5.523 0 10-4.145 10-9.243C21.585 6.145 17.523 2 12 2zm1.074 12.457l-2.545-2.717-4.97 2.717 5.469-5.783 2.604 2.717 4.907-2.717-5.465 5.783z"/></svg>
                        <div class="flex flex-col items-start">
                            <span data-i18n="messenger">Messenger</span>
                            <span class="text-[10px] font-medium opacity-80 leading-tight" data-i18n="messenger_sub">Opens & copies order</span>
                        </div>                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- IMAGE MODAL -->
    <div id="image-modal"
        class="fixed inset-0 z-[80] bg-black/95 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300"
        onclick="closeImageModal()">
        <button
            class="absolute top-6 right-6 text-white bg-dm-card/80 p-2 rounded-full backdrop-blur-sm z-10 hover:bg-dm-border">✕</button>
        <img id="image-modal-src" src=""
            class="max-w-full max-h-[90vh] object-contain rounded-2xl shadow-2xl transform scale-95 transition-transform duration-300"
            onclick="event.stopPropagation()">
    </div>

    <script src="config.min.js"></script>

    <script src="app.min.js"></script>

    <!-- Service Worker for offline support -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>

</body>
